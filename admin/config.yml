# ============================================================================
# FANTASY FILMBALL — Decap CMS Configuration
# This file defines what you see in the admin panel at /admin
# Each "collection" becomes a section in the admin sidebar.
# ============================================================================

backend:
  name: github
  repo: Brenfred/brenfred.github.io   # Your GitHub repo
  branch: main
  # Our own OAuth proxy (Cloudflare Worker)
  base_url: https://filmball-oauth.brad-derfner.workers.dev
  # Commit messages that show up in GitHub
  commit_messages:
    create: "Add {{collection}} '{{slug}}'"
    update: "Update {{collection}} '{{slug}}'"
    delete: "Remove {{collection}} '{{slug}}'"
    uploadMedia: "Upload poster '{{path}}'"
    deleteMedia: "Remove poster '{{path}}'"

# Where uploaded poster images go
media_folder: "posters"
public_folder: "/posters"

# Open the editor in a side-by-side view (form on left, preview on right)
editor:
  preview: false

# Use simple slug rules for filenames (lowercase, hyphens)
slug:
  encoding: "ascii"
  clean_accents: true
  sanitize_replacement: "-"

# ----------------------------------------------------------------------------
# COLLECTIONS — each one becomes a sidebar entry in the admin UI
# ----------------------------------------------------------------------------
collections:

  # ─── Site Settings ─────────────────────────────────────────────────────────
  # Single record (a "file collection"). Edits global stuff like the hero film
  # and the current YouTube video.
  - name: "site"
    label: "📺 Site Settings"
    description: "The latest YouTube episode and which review is the current homepage hero."
    files:
      - name: "settings"
        label: "Site Settings"
        file: "content/site.json"
        fields:
          - { name: "youtubeVideoId", label: "Latest YouTube Video ID", widget: "string",
              hint: "Just the ID — the part after 'v=' in a YouTube URL. Example: Yxvdm3Y4HfI" }
          - { name: "heroReviewSlug", label: "Homepage Hero — review slug", widget: "string",
              hint: "Match the filename of a review without .md. Example: the-odyssey" }
          - { name: "rankingsDate", label: "Rankings — display date", widget: "string",
              hint: "e.g. 'April 3, 2026'" }
          - { name: "rankingsLabel", label: "Rankings — short label", widget: "string",
              hint: "Appears in the widget header. e.g. 'Updated April 3'" }

  # ─── Best Picture Rankings ─────────────────────────────────────────────────
  # WORKFLOW: To update rankings with movement arrows:
  #   1. Open "Previous Snapshot" → click "Copy Current to Previous" button at top
  #      (or manually paste in last week's values)
  #   2. Then open "Current Rankings" → edit, publish
  # Movement arrows compute automatically from the diff.
  - name: "rankings"
    label: "📊 Best Picture Rankings"
    description: "The Top 20 list shown in the ticker and homepage widget. Movement arrows (▲▼—NEW) compute automatically by comparing Current vs Previous Snapshot. Workflow: BEFORE editing Current, copy the existing Current values into Previous Snapshot first."
    files:
      - name: "current"
        label: "Current Rankings (Top 20)"
        file: "content/rankings.json"
        fields:
          - { name: "updatedDate", label: "Date Label", widget: "string",
              hint: "e.g. 'April 3, 2026' — appears in the widget" }
          - { name: "cutoffRank", label: "Nominee Cutoff Rank", widget: "number",
              default: 10, hint: "Where the dashed line lands (usually 10)" }
          - name: "films"
            label: "Top 20 Films"
            label_singular: "Film"
            widget: "list"
            summary: "{{fields.rank}}. {{fields.title}} — {{fields.nomPct}}"
            fields:
              - { name: "rank",   label: "Rank",   widget: "number", value_type: "int", min: 1, max: 20 }
              - { name: "title",  label: "Title",  widget: "string" }
              - { name: "nomPct", label: "Nom %", widget: "string", hint: "e.g. '95%'" }
      - name: "previous"
        label: "Previous Snapshot (read-only reference)"
        file: "content/rankings-previous.json"
        fields:
          - { name: "updatedDate", label: "Date Label", widget: "string" }
          - { name: "cutoffRank", label: "Cutoff", widget: "number" }
          - name: "films"
            label: "Films"
            widget: "list"
            summary: "{{fields.rank}}. {{fields.title}}"
            fields:
              - { name: "rank",   label: "Rank",   widget: "number", value_type: "int" }
              - { name: "title",  label: "Title",  widget: "string" }
              - { name: "nomPct", label: "Nom %", widget: "string" }

  # ─── Writers ───────────────────────────────────────────────────────────────
  # One JSON file per writer. Reviews then "tag" writers via a multi-select
  # relation field, so every byline points at a real profile page.
  - name: "writers"
    label: "✍️ Writers"
    description: "One record per writer. Hosts have 'Host' in their role and appear in the Hosts section of writers.html; everyone else is a Contributor."
    folder: "content/writers"
    create: true
    delete: true
    extension: "json"
    format: "json"
    slug: "{{fields.slug}}"
    identifier_field: "slug"
    summary: "{{fields.name}} — {{fields.role}}"
    media_folder: "/headshots"
    public_folder: "/headshots"
    fields:
      - { name: "name", label: "Full Name", widget: "string", hint: "e.g. 'Brad Derfner'" }
      - { name: "slug", label: "Slug (URL identifier)", widget: "string",
          hint: "Lowercase, hyphens, no spaces. e.g. 'brad-derfner'. This is the filename and the URL: writer.html?slug=brad-derfner. Don't change after creation — review references will break." }
      - { name: "role", label: "Full Role", widget: "string", default: "Contributor",
          hint: "e.g. 'Editor & Co-host', 'Critic at Large'. If it contains the word 'Host', the writer appears in the Hosts section of writers.html." }
      - { name: "shortRole", label: "Short Role (used as kicker)", widget: "string", required: false, default: "Writer",
          hint: "Short version for the writer page kicker. e.g. 'Editor', 'Critic'." }
      - { name: "bio", label: "Short Bio", widget: "text",
          hint: "2-3 sentences shown on writers.html and as the meta description." }
      - { name: "longBio", label: "Long Bio (writer page)", widget: "text", required: false,
          hint: "Multi-paragraph bio shown on the writer's detail page. Separate paragraphs with blank lines. Falls back to Short Bio if empty." }
      - { name: "pullQuote", label: "Pull Quote (optional)", widget: "string", required: false,
          hint: "An optional signature quote that appears at the top of the writer's detail page." }
      - { name: "headshot", label: "Headshot", widget: "image", required: false,
          hint: "Upload a square JPG or PNG. Recommended size: 400×400px or larger. If you don't upload one, a typographic monogram (initials) shows instead." }
      - name: "favorites"
        label: "Films on the desk (favorites)"
        widget: "list"
        required: false
        default: []
        hint: "A short list of films that capture this writer's taste. Shown on their detail page."
        field: { name: "title", label: "Film", widget: "string" }
      - { name: "twitter", label: "Twitter / X", widget: "string", required: false,
          hint: "Either a handle ('@brad' or 'brad') or a full URL ('https://x.com/brad'). Will auto-link." }
      - { name: "letterboxd", label: "Letterboxd", widget: "string", required: false,
          hint: "Either a handle ('Dyl_' or '@Dyl_') or a full URL ('https://letterboxd.com/Dyl_'). Will auto-link." }
      - { name: "joinedDate", label: "Joined", widget: "string", required: false, default: "2024", hint: "Year or month/year." }

  # ─── Reviews ───────────────────────────────────────────────────────────────
  # A folder collection — one Markdown file per review. The CMS gives you a
  # "+ New Review" button that creates a new file in this folder.
  - name: "reviews"
    label: "📝 Articles"
    description: "Film reviews AND awards-discussion pieces. Set the Article Type field first — that controls which other fields are required."
    folder: "content/reviews"
    create: true
    delete: true
    slug: "{{fields.posterSlug}}"
    summary: "{{fields.type}}: {{fields.title}}"
    fields:
      - name: "type"
        label: "Article Type"
        widget: "select"
        options:
          - { label: "Review (film-specific, with rating/stance)", value: "review" }
          - { label: "Discussion (analysis, predictions, category breakdowns)", value: "discussion" }
        default: "review"
        hint: "REVIEW = traditional film writeup with Buy/Hold/Sell + star rating. DISCUSSION = analysis pieces about a category, the race, or multiple films. Both types live on the same Articles page."
      - { name: "title",    label: "Headline", widget: "string",
          hint: "The big headline. e.g. 'The Odyssey takes the early lead' (review) or 'Why Best Director is a two-horse race' (discussion)" }
      - { name: "film",     label: "Film Title", widget: "string", required: false,
          hint: "REVIEWS: the film being reviewed. DISCUSSIONS: leave blank, or set if the piece is anchored to one film." }
      - { name: "director", label: "Director", widget: "string", required: false,
          hint: "REVIEWS: required. DISCUSSIONS: optional." }
      - { name: "studio",   label: "Studio / Distributor", widget: "string", required: false }
      - { name: "runtime",  label: "Runtime", widget: "string", required: false, hint: "e.g. '168 min'. Reviews only." }
      - { name: "genre",    label: "Genre", widget: "string", required: false }
      - { name: "rating",   label: "Rating (out of 5)", widget: "number", value_type: "float",
          min: 0, max: 5, step: 0.5, required: false,
          hint: "REVIEWS: required (0-5 in half steps). DISCUSSIONS: leave blank — no star rating will show." }
      - name: "stance"
        label: "Stock Stance"
        widget: "select"
        options:
          - { label: "(none — discussion piece)", value: "" }
          - { label: "Buy", value: "buy" }
          - { label: "Hold", value: "hold" }
          - { label: "Sell", value: "sell" }
        required: false
        default: "buy"
        hint: "REVIEWS: drives the green/yellow/red badge. DISCUSSIONS: choose '(none)' to skip the badge entirely, or pick a stance to express the piece's overall lean."
      - { name: "stanceLabel", label: "Stance Label", widget: "string", required: false,
          hint: "e.g. 'Strong Buy', 'Buy', 'Hold', 'Sell', 'Strong Sell'. Only used if a Stance is set above." }
      - { name: "posterSlug", label: "Poster filename (no extension)", widget: "string", required: false,
          hint: "REVIEWS: matches a file in /posters/. DISCUSSIONS: optional — leave blank for a typographic card, or set if you want a film poster as the visual." }
      - { name: "writer", label: "Legacy Writer Byline (fallback only)", widget: "string", default: "[ Writer ]", required: false,
          hint: "Old free-text field. Used only if 'Writers' below is empty. Prefer the multi-select Writers field." }
      - name: "writers"
        label: "Writers"
        widget: "relation"
        collection: "writers"
        value_field: "slug"
        search_fields: ["name", "role"]
        display_fields: ["name", "role"]
        multiple: true
        required: false
        hint: "Pick one or more writers from the Writers collection. Their bylines will link to their detail pages."
      - name: "contributors"
        label: "Contributors (non-byline)"
        widget: "relation"
        collection: "writers"
        value_field: "slug"
        search_fields: ["name", "role"]
        display_fields: ["name", "role"]
        multiple: true
        required: false
        hint: "Optional. Writers credited on their own writer page WITHOUT appearing in the byline — e.g. staff who voted in an awards roundup. The byline uses only the Writers field above."
      - { name: "publishedDate", label: "Published Date", widget: "string",
          hint: "e.g. 'April 3, 2026'" }
      - { name: "deck", label: "Subheadline", widget: "text",
          hint: "2-3 sentences. Shown under the headline on the single article page and the homepage hero block." }
      - { name: "excerpt", label: "Tagline (Card Blurb)", widget: "string", required: false,
          hint: "ONE short sentence — under ~120 characters. Shown on article cards in the home grid, archive list, and tagged-film pages. KEEP THIS BRIEF — don't paste the body here." }
      - { name: "heroImage", label: "Article Hero Image", widget: "image", required: false,
          hint: "Wide landscape image shown at the top of the article page (under the headline). Recommended size: 1600×900 or wider, JPG or PNG. If left blank, the hero block is hidden." }
      - { name: "heroCaption", label: "Hero Image Caption / Credit", widget: "string", required: false,
          hint: "Optional photo credit or caption overlay on the hero image. e.g. 'Lionsgate · Photo by Anne Marie Fox'. Leave blank for no caption." }
      - { name: "verdictNote", label: "Verdict Note (Stock Take)", widget: "string", required: false,
          hint: "REVIEWS only. One punchy stock-betting sentence shown next to the rating/badge at the top of the article. e.g. 'Lock it in now — by Telluride you'll wish you had bought earlier.' Leave blank to hide. Skipped automatically for Discussion-type articles." }
      - name: "prospects"
        label: "Writer's Prospects"
        widget: "list"
        required: false
        default: []
        summary: "{{fields.category}} — {{fields.tier}}"
        hint: "Optional. The writer's personal call on this film's awards prospects, category by category. Each entry: pick a category, set a tier (Predicted / In the Mix / Long Shot), and optionally add the performer name (for acting categories) or a short note. Shown in the sidebar grouped by tier. Leave the entire list empty to hide the whole Prospects block on this article."
        fields:
          - name: "category"
            label: "Category"
            widget: "select"
            options:
              # Top 8 — these match the Oscar Race rankings
              - { label: "Best Picture",              value: "picture" }
              - { label: "Best Director",             value: "director" }
              - { label: "Best Actress",              value: "actress" }
              - { label: "Best Actor",                value: "actor" }
              - { label: "Best Supporting Actress",   value: "supp-actress" }
              - { label: "Best Supporting Actor",     value: "supp-actor" }
              - { label: "Best Original Screenplay",  value: "orig-screenplay" }
              - { label: "Best Adapted Screenplay",   value: "adapt-screenplay" }
              # Craft and other categories — not tracked in the Oscar Race
              # tables but writers can still flag them in their prospects.
              - { label: "Best Cinematography",       value: "cinematography" }
              - { label: "Best Film Editing",         value: "editing" }
              - { label: "Best Production Design",    value: "production-design" }
              - { label: "Best Costume Design",       value: "costume-design" }
              - { label: "Best Makeup and Hairstyling", value: "makeup-hair" }
              - { label: "Best Sound",                value: "sound" }
              - { label: "Best Visual Effects",       value: "vfx" }
              - { label: "Best Original Score",       value: "score" }
              - { label: "Best Original Song",        value: "song" }
              - { label: "Best Casting",              value: "casting" }
              - { label: "Best International Feature",value: "international" }
              - { label: "Best Animated Feature",     value: "animated" }
              - { label: "Best Documentary Feature",  value: "documentary" }
              - { label: "Best Documentary Short",    value: "doc-short" }
              - { label: "Best Animated Short",       value: "animated-short" }
              - { label: "Best Live Action Short",    value: "live-short" }
          - name: "tier"
            label: "Tier"
            widget: "select"
            options:
              - { label: "Predicted",  value: "predicted" }
              - { label: "In the Mix", value: "in-the-mix" }
              - { label: "Long Shot",  value: "long-shot" }
            default: "predicted"
          - { name: "performer", label: "Performer / Credit (optional)", widget: "string", required: false,
              hint: "For acting categories, the performer's name (e.g. 'Matt Damon'). For screenplay categories, the writer's name. For Best Picture/Director, leave blank." }
          - { name: "note", label: "Short Note (optional)", widget: "string", required: false,
              hint: "Optional one-line nuance, e.g. 'if the campaign holds' or 'category fraud territory'. Shown in italics under the entry." }
      - { name: "isHero", label: "Mark as Homepage Hero", widget: "boolean",
          default: false,
          hint: "Only one article should be marked as hero at a time" }
      - name: "tags"
        label: "Film Tags"
        widget: "list"
        required: false
        default: []
        hint: "Slugs of films this article mentions (e.g. the-odyssey, digger). Tagged films show this article on their detail page."
        field: { name: "slug", label: "Film Slug", widget: "string" }
      - name: "categoryTags"
        label: "Category Tags"
        widget: "list"
        required: false
        default: []
        hint: "Slugs of Oscar categories this article discusses. Valid values: picture, director, actor, actress, supp-actor, supp-actress, orig-screenplay, adapt-screenplay. Used by discussion pieces to link back to category pages."
        field: { name: "slug", label: "Category Slug", widget: "string" }
      - { name: "body", label: "Article Body", widget: "markdown",
          hint: "Paste your prose here. Paragraphs are separated by blank lines." }

  # ─── Films ─────────────────────────────────────────────────────────────────
  # Master record per tracked film. Used by Oscar Race page and category pages
  # to look up titles, posters, directors, etc.
  - name: "films"
    label: "🎬 Films"
    description: "Master record per tracked film. Add a new file here whenever a new film enters the conversation."
    folder: "content/films"
    create: true
    delete: true
    extension: "json"
    format: "json"
    slug: "{{fields.posterSlug}}"
    summary: "{{fields.title}}"
    fields:
      - { name: "title",       label: "Film Title", widget: "string" }
      - { name: "director",    label: "Director", widget: "string", required: false }
      - { name: "studio",      label: "Studio / Distributor", widget: "string", required: false }
      - { name: "posterSlug",  label: "Poster filename (no extension)", widget: "string",
          hint: "e.g. 'the-odyssey' — must match a file in /posters/" }
      - { name: "releaseDate", label: "Release Date", widget: "string", required: false }
      - { name: "runtime",     label: "Runtime", widget: "string", required: false }

  # ─── Ranking Snapshots ──────────────────────────────────────────────────────
  # One file per snapshot in time (Pre-Cannes, Post-Cannes, Pre-Fall, etc).
  # Each contains ALL 8 categories for that moment. The site shows the latest
  # snapshot as "current" and uses the previous one for movement arrows.
  # Users can also toggle to view any historical snapshot.
  - name: "ranking-snapshots"
    label: "📅 Ranking Snapshots"
    description: "Each entry is one moment in time (Pre-Cannes, Post-Cannes, monthly updates, etc). Sorted chronologically by 'sortKey'. Newest snapshot becomes the site default. Movement arrows compare it to the previous snapshot."
    folder: "content/ranking-snapshots"
    create: true
    delete: false
    extension: "json"
    format: "json"
    slug: "{{fields.snapshotSlug}}"
    summary: "{{fields.label}} — {{fields.publishedDate}}"
    fields:
      - { name: "snapshotSlug", label: "Snapshot Slug (file name)", widget: "string",
          hint: "e.g. '2026-05-post-cannes'. Used as the filename. Don't include the .json extension." }
      - { name: "label", label: "Display Label", widget: "string",
          hint: "What users see in the toggle. e.g. 'Pre-Cannes', 'Post-Cannes', 'Pre-Fall Festivals', 'September 2026'." }
      - { name: "sortKey", label: "Sort Key", widget: "string",
          hint: "Used to order snapshots chronologically. Format: YYYY-MM (e.g. '2026-04', '2026-05', '2026-08'). Newer key = newer snapshot. Same-month snapshots can use YYYY-MM-a / YYYY-MM-b." }
      - { name: "publishedDate", label: "Published Date", widget: "string",
          hint: "e.g. 'April 3, 2026'. Shown under the toggle." }
      - { name: "description", label: "Short Description", widget: "text", required: false,
          hint: "1-2 sentence summary of what changed in this snapshot. Shown on the Oscar Race page when this snapshot is selected." }
      - name: "categories"
        label: "Categories (all 8)"
        widget: "object"
        hint: "All 8 categories in one place. Each has its own rankings list."
        fields:
          - { name: "picture", label: "🏆 Best Picture", widget: "object", fields: &cat_fields [
              { name: "label", label: "Full Label", widget: "string", default: "Best Picture" },
              { name: "shortLabel", label: "Short Label", widget: "string", default: "Picture" },
              { name: "cutoffRank", label: "Cutoff Rank", widget: "number", value_type: "int", default: 10,
                hint: "Where the dashed predicted-cutoff line is drawn. 10 for Best Picture, 5 for others." },
              { name: "films", label: "Films", widget: "list", summary: "{{fields.rank}}. {{fields.subtitle}} ({{fields.filmSlug}})",
                fields: [
                  { name: "rank", label: "Rank", widget: "number", value_type: "int", min: 1, max: 20 },
                  { name: "filmSlug", label: "Film Slug", widget: "string", required: false,
                    hint: "Match a film file in /content/films/." },
                  { name: "subtitle", label: "Display Text", widget: "string", required: false,
                    hint: "For acting categories, the performer's name. For others, the director or blank." },
                  { name: "nomPct", label: "Nom %", widget: "string", required: false },
                  { name: "winPct", label: "Win %", widget: "string", required: false }
                ]
              }
            ] }
          - { name: "director", label: "🎬 Best Director", widget: "object", fields: *cat_fields }
          - { name: "actress", label: "👩 Best Actress", widget: "object", fields: *cat_fields }
          - { name: "actor", label: "👨 Best Actor", widget: "object", fields: *cat_fields }
          - { name: "supp-actress", label: "🥈 Supp. Actress", widget: "object", fields: *cat_fields }
          - { name: "supp-actor", label: "🥈 Supp. Actor", widget: "object", fields: *cat_fields }
          - { name: "orig-screenplay", label: "✍️ Original Screenplay", widget: "object", fields: *cat_fields }
          - { name: "adapt-screenplay", label: "📜 Adapted Screenplay", widget: "object", fields: *cat_fields }
